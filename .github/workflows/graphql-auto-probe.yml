name: Threads Anonymous Auto GraphQL Probe

on:
  push:
    branches:
      - automation/threads
    paths:
      - .graphql-auto-request.json

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Crawl current Relay profile pages
        shell: bash
        run: |
          python - <<'PY'
          import json, math, re, urllib.request
          from playwright.sync_api import sync_playwright

          cfg = json.load(open('.graphql-auto-request.json', encoding='utf-8'))
          profile_url = cfg['profile_url']
          user_id = str(cfg['user_id'])
          target_count = int(cfg.get('target_count', 24))
          page_size = 24
          max_pages = max(1, math.ceil(target_count / page_size))

          network = json.load(open('data/network_docids.json', encoding='utf-8'))
          target = next(x for x in network['relay_operations'] if x['name'] == 'BarcelonaProfileThreadsTabRefetchableDirectQuery')
          doc_id = target['doc_id']
          js_url = target['url']

          with urllib.request.urlopen(urllib.request.Request(js_url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=30) as r:
              script = r.read().decode('utf-8', errors='ignore')
          needle = 'BarcelonaProfileThreadsTabRefetchableDirectQuery.threads.graphql'
          pos = script.find(needle)
          if pos < 0:
              raise SystemExit('query module not found')
          snippet = script[max(0, pos - 5000):min(len(script), pos + 150000)]
          providers = sorted(set(re.findall(r'__relay_internal__pv__[A-Za-z0-9_]+relayprovider', snippet)))

          base_vars = {k: False for k in providers}
          for k in providers:
              if 'IsCrawler' in k or 'OptionalCookiesEnabled' in k or 'IsLoggedOut' in k:
                  base_vars[k] = True
          base_vars.update({
              'allow_page_info_for_lox_user': True,
              'before': None,
              'first': page_size,
              'last': None,
              'userID': user_id,
          })

          result = {
              'doc_id': doc_id,
              'target_count': target_count,
              'retrieved_unique_count': 0,
              'reached_target': False,
              'stop_reason': None,
              'page_size': page_size,
              'provider_count': len(providers),
              'pages': [],
              'post_ids': [],
          }
          seen_ids = set()
          cursor = None

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(locale='en-US', viewport={'width': 1280, 'height': 1200})
              page = context.new_page()
              page.goto(profile_url, wait_until='domcontentloaded', timeout=90000)
              page.wait_for_timeout(5000)

              html = page.content()
              tokens = []
              for pat in [r'"LSD",\[\],\{"token":"([^"]+)"', r'"token":"([A-Za-z0-9_-]{18,80})"']:
                  for x in re.findall(pat, html):
                      if x not in tokens:
                          tokens.append(x)
              lsd = tokens[0] if tokens else 't'

              for page_no in range(1, max_pages + 1):
                  variables = dict(base_vars)
                  variables['after'] = cursor
                  payload = {
                      'doc_id': doc_id,
                      'lsd': lsd,
                      'variables': json.dumps(variables, separators=(',', ':')),
                  }
                  res = page.evaluate('''async p=>{const f=new URLSearchParams();f.set('lsd',p.lsd);f.set('doc_id',p.doc_id);f.set('variables',p.variables);const r=await fetch('/api/graphql',{method:'POST',credentials:'include',headers:{'Content-Type':'application/x-www-form-urlencoded','X-FB-LSD':p.lsd,'X-IG-App-ID':'238260118697367','X-FB-Friendly-Name':'BarcelonaProfileThreadsTabRefetchableDirectQuery'},body:f.toString()});return {status:r.status,type:r.headers.get('content-type'),text:await r.text()}}''', payload)

                  page_result = {
                      'page': page_no,
                      'status': res.get('status'),
                      'content_type': res.get('type'),
                      'after': cursor,
                  }
                  if res.get('status') != 200:
                      result['stop_reason'] = f'http_{res.get("status")}'
                      result['pages'].append(page_result)
                      break

                  try:
                      obj = json.loads(res.get('text') or '')
                  except Exception as e:
                      page_result['json_error'] = str(e)
                      result['pages'].append(page_result)
                      result['stop_reason'] = 'invalid_json'
                      break

                  errors = obj.get('errors') if isinstance(obj, dict) else None
                  page_result['errors'] = errors
                  data = obj.get('data') if isinstance(obj, dict) else None
                  media = data.get('mediaData') if isinstance(data, dict) else None
                  edges = media.get('edges') if isinstance(media, dict) and isinstance(media.get('edges'), list) else []
                  page_info = media.get('page_info') if isinstance(media, dict) and isinstance(media.get('page_info'), dict) else {}

                  ids_this_page = []
                  new_ids = []
                  for edge in edges:
                      try:
                          items = edge.get('node', {}).get('thread_items', [])
                          pk = str(items[0].get('post', {}).get('pk', '')) if items else ''
                      except Exception:
                          pk = ''
                      if not pk:
                          continue
                      ids_this_page.append(pk)
                      if pk not in seen_ids:
                          seen_ids.add(pk)
                          new_ids.append(pk)
                          result['post_ids'].append(pk)

                  next_cursor = page_info.get('end_cursor')
                  has_next = bool(page_info.get('has_next_page'))
                  page_result.update({
                      'edge_count': len(edges),
                      'unique_ids_on_page': len(set(ids_this_page)),
                      'new_unique_ids': len(new_ids),
                      'total_unique_ids': len(seen_ids),
                      'end_cursor': next_cursor,
                      'has_next_page': has_next,
                  })
                  result['pages'].append(page_result)

                  if len(seen_ids) >= target_count:
                      result['reached_target'] = True
                      result['stop_reason'] = 'target_reached'
                      break
                  if not new_ids:
                      result['stop_reason'] = 'no_new_posts'
                      break
                  if not has_next or not next_cursor:
                      result['stop_reason'] = 'no_next_cursor'
                      break
                  if next_cursor == cursor:
                      result['stop_reason'] = 'cursor_stalled'
                      break
                  cursor = next_cursor

              browser.close()

          result['retrieved_unique_count'] = len(seen_ids)
          if result['retrieved_unique_count'] > target_count:
              result['post_ids'] = result['post_ids'][:target_count]
              result['retrieved_unique_count'] = target_count
          if result['retrieved_unique_count'] >= target_count:
              result['reached_target'] = True
              result['stop_reason'] = 'target_reached'

          with open('data/graphql_auto_probe.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
      - name: Commit result
        run: |
          git config user.name threads-fetch-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/graphql_auto_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Probe sequential Threads profile pagination'
          git push origin "HEAD:${GITHUB_REF_NAME}"
