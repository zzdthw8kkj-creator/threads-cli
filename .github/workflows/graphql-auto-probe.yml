name: Threads Anonymous Auto GraphQL Probe

on:
  push:
    branches:
      - automation/threads
    paths:
      - .graphql-auto-request.json

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Auto-build current Relay variables and probe
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from playwright.sync_api import sync_playwright

          cfg=json.load(open('.graphql-auto-request.json',encoding='utf-8'))
          profile_url=cfg['profile_url']; user_id=str(cfg['user_id'])
          network=json.load(open('data/network_docids.json',encoding='utf-8'))
          target=next(x for x in network['relay_operations'] if x['name']=='BarcelonaProfileThreadsTabRefetchableDirectQuery')
          doc_id=target['doc_id']; js_url=target['url']
          with urllib.request.urlopen(urllib.request.Request(js_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
              script=r.read().decode('utf-8',errors='ignore')
          needle='BarcelonaProfileThreadsTabRefetchableDirectQuery.threads.graphql'
          pos=script.find(needle)
          if pos < 0: raise SystemExit('query module not found')
          snippet=script[max(0,pos-5000):min(len(script),pos+150000)]
          providers=sorted(set(re.findall(r'__relay_internal__pv__[A-Za-z0-9_]+relayprovider',snippet)))
          vars={k:False for k in providers}
          for k in providers:
              if 'IsCrawler' in k or 'OptionalCookiesEnabled' in k or 'IsLoggedOut' in k:
                  vars[k]=True
          vars.update({
              'after':None,
              'allow_page_info_for_lox_user':True,
              'before':None,
              'first':24,
              'last':None,
              'userID':user_id,
          })

          result={'doc_id':doc_id,'provider_count':len(providers),'provider_names':providers,'variables':vars}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(locale='en-US',viewport={'width':1280,'height':1200})
              page=context.new_page(); page.goto(profile_url,wait_until='domcontentloaded',timeout=90000); page.wait_for_timeout(5000)
              html=page.content(); tokens=[]
              for pat in [r'"LSD",\[\],\{"token":"([^"]+)"',r'"token":"([A-Za-z0-9_-]{18,80})"']:
                  for x in re.findall(pat,html):
                      if x not in tokens: tokens.append(x)
              lsd=tokens[0] if tokens else 't'
              payload={'doc_id':doc_id,'lsd':lsd,'variables':json.dumps(vars,separators=(',',':'))}
              res=page.evaluate('''async p=>{const f=new URLSearchParams();f.set('lsd',p.lsd);f.set('doc_id',p.doc_id);f.set('variables',p.variables);const r=await fetch('/api/graphql',{method:'POST',credentials:'include',headers:{'Content-Type':'application/x-www-form-urlencoded','X-FB-LSD':p.lsd,'X-IG-App-ID':'238260118697367','X-FB-Friendly-Name':'BarcelonaProfileThreadsTabRefetchableDirectQuery'},body:f.toString()});return {status:r.status,type:r.headers.get('content-type'),text:await r.text()}}''',payload)
              result['status']=res['status']; result['content_type']=res['type']; result['body_prefix']=res['text'][:2500]
              try:
                  obj=json.loads(res['text']); result['errors']=obj.get('errors'); data=obj.get('data'); result['data_is_null']=data is None
                  def scan(n,pages,edges):
                      if isinstance(n,dict):
                          if isinstance(n.get('page_info'),dict): pages.append(n['page_info'])
                          if isinstance(n.get('edges'),list): edges[0]+=len(n['edges'])
                          for v in n.values(): scan(v,pages,edges)
                      elif isinstance(n,list):
                          for v in n: scan(v,pages,edges)
                  pages=[]; edges=[0]; scan(data,pages,edges); result['page_infos']=pages[:20]; result['edge_count']=edges[0]
              except Exception as e: result['json_error']=str(e)
              browser.close()
          with open('data/graphql_auto_probe.json','w',encoding='utf-8') as f: json.dump(result,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
      - name: Commit result
        run: |
          git config user.name threads-fetch-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/graphql_auto_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Probe current Threads Relay variables automatically'
          git push origin "HEAD:${GITHUB_REF_NAME}"
