name: Threads Monetization Corpus Lab

on:
  push:
    branches:
      - automation/threads
    paths:
      - .monetization-corpus-request.json

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Collect and analyze monetization corpus
        run: python scripts/monetization_corpus.py
      - name: Commit corpus and analysis
        run: |
          git config user.name monetization-research-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monetization_benchmark/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Collect and analyze monetization benchmark corpora'
          git push origin "HEAD:${GITHUB_REF_NAME}"
