name: Threads Fetch Bridge

on:
  push:
    branches:
      - automation/threads
    paths:
      - .threads-request.json

permissions:
  contents: write

concurrency:
  group: threads-fetch-bridge
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read request
        id: request
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from urllib.parse import urlparse

          req = json.load(open('.threads-request.json', encoding='utf-8'))
          mode = str(req.get('mode', 'profile')).strip().lower()
          limit = int(req.get('limit', 50))
          if mode not in {'profile', 'search', 'note_creator'}:
              raise SystemExit('mode must be profile, search, or note_creator')
          if not 1 <= limit <= 500:
              raise SystemExit('limit must be between 1 and 500')
          print(f'mode={mode}')
          print(f'limit={limit}')

          if mode == 'profile':
              username = str(req.get('username', '')).lstrip('@').strip()
              if not username:
                  profile_url = str(req.get('profile_url', '')).strip()
                  if profile_url:
                      path = urlparse(profile_url).path.strip('/')
                      first = path.split('/', 1)[0] if path else ''
                      if first.startswith('@'):
                          username = first[1:]
              if not username or not all(c.isalnum() or c in '._' for c in username):
                  raise SystemExit('profile mode requires a valid username or Threads profile_url')
              print(f'username={username}')
              hydrate = bool(req.get('hydrate_replies', False))
              print(f'hydrate_replies={str(hydrate).lower()}')
          elif mode == 'search':
              query = str(req.get('query', '')).strip()
              if not query:
                  raise SystemExit('search mode requires query')
              print(f'query={query}')
          else:
              note_user = str(req.get('note_user', '')).strip()
              if not note_user or not all(c.isalnum() or c in '._' for c in note_user):
                  raise SystemExit('Invalid note_user')
              print(f'note_user={note_user}')
          PY

      - name: Build threads-cli
        if: steps.request.outputs.mode != 'note_creator'
        shell: bash
        run: go build -o /tmp/th ./cmd/th

      - name: Fetch data
        shell: bash
        run: |
          mkdir -p data
          MODE="${{ steps.request.outputs.mode }}"
          if [ "$MODE" = "profile" ]; then
            /tmp/th profile "@${{ steps.request.outputs.username }}" --posts -n "${{ steps.request.outputs.limit }}" -o json > data/posts_raw.json

            if [ "${{ steps.request.outputs.hydrate_replies }}" = "true" ]; then
              python - <<'PY'
          import json, subprocess

          roots = json.load(open('data/posts_raw.json', encoding='utf-8'))
          bundles = []
          compact = []

          def pick(row):
              keys = ['id','shortcode','text','permalink','username','timestamp','like_count','reply_count','repost_count','quote_count','media_type','parent_id','root_id']
              return {k: row.get(k) for k in keys if row.get(k) is not None}

          for root in roots:
              url = root.get('permalink') or root.get('shortcode') or root.get('id')
              replies = []
              error = None
              if url:
                  proc = subprocess.run(
                      ['/tmp/th', 'post', str(url), '--replies', '-n', '50', '-o', 'json'],
                      text=True,
                      capture_output=True,
                      timeout=120,
                  )
                  if proc.returncode == 0:
                      try:
                          parsed = json.loads(proc.stdout or '[]')
                          if isinstance(parsed, list):
                              replies = parsed
                      except Exception as e:
                          error = f'json:{e}'
                  else:
                      error = (proc.stderr or f'exit {proc.returncode}').strip()[-1000:]

              self_replies = [r for r in replies if r.get('username') == root.get('username')]
              bundles.append({
                  'root': root,
                  'replies': replies,
                  'self_replies': self_replies,
                  'hydrate_error': error,
              })

              text_replies = [r for r in self_replies if (r.get('text') or '').strip()]
              parts = [(root.get('text') or '').strip()] + [(r.get('text') or '').strip() for r in text_replies]
              parts = [p for p in parts if p]
              root_text = (root.get('text') or '').rstrip()
              continuation_marker = root_text.endswith('↓') or root_text.endswith('解説すると、') or root_text.endswith('解説すると') or root_text.endswith('結果として起きてること')
              compact.append({
                  'root': pick(root),
                  'self_replies': [pick(r) for r in self_replies],
                  'full_text': '\n\n'.join(parts),
                  'continuation_marker': continuation_marker,
                  'self_reply_count': len(self_replies),
                  'text_self_reply_count': len(text_replies),
                  'hydrate_error': error,
              })

          with open('data/threads_hydrated.json', 'w', encoding='utf-8') as f:
              json.dump(bundles, f, ensure_ascii=False, indent=2)
              f.write('\n')
          with open('data/analysis_input.json', 'w', encoding='utf-8') as f:
              json.dump(compact, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
            fi
          elif [ "$MODE" = "search" ]; then
            /tmp/th search "${{ steps.request.outputs.query }}" -n "${{ steps.request.outputs.limit }}" -o json > data/search_raw.json
          else
            python - <<'PY'
          import json, urllib.request
          user = "${{ steps.request.outputs.note_user }}"
          req = urllib.request.Request(
              f"https://note.com/api/v2/creators/{user}",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              body = json.load(r)
          with open('data/note_creator.json','w',encoding='utf-8') as f:
              json.dump(body,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          fi

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          req = json.load(open('.threads-request.json', encoding='utf-8'))
          mode = str(req.get('mode', 'profile')).strip().lower()
          meta = {
              'mode': mode,
              'requested_limit': int(req.get('limit', 50)),
              'source': 'threads-cli' if mode in {'profile','search'} else 'note-api',
              'generated_at': datetime.now(timezone.utc).isoformat(),
          }
          if mode == 'profile':
              rows = json.load(open('data/posts_raw.json', encoding='utf-8'))
              meta['retrieved_count'] = len(rows) if isinstance(rows, list) else None
              username = str(req.get('username', '')).lstrip('@').strip()
              if not username:
                  profile_url = str(req.get('profile_url', '')).strip()
                  path = urlparse(profile_url).path.strip('/') if profile_url else ''
                  first = path.split('/', 1)[0] if path else ''
                  username = first[1:] if first.startswith('@') else first
              meta['username'] = username
              meta['hydrate_replies'] = bool(req.get('hydrate_replies', False))
              if os.path.exists('data/threads_hydrated.json'):
                  bundles = json.load(open('data/threads_hydrated.json', encoding='utf-8'))
                  meta['hydrated_thread_count'] = len(bundles)
                  meta['self_reply_count'] = sum(len(x.get('self_replies', [])) for x in bundles)
                  meta['hydrate_error_count'] = sum(1 for x in bundles if x.get('hydrate_error'))
          elif mode == 'search':
              rows = json.load(open('data/search_raw.json', encoding='utf-8'))
              meta['retrieved_count'] = len(rows) if isinstance(rows, list) else None
              meta['query'] = str(req.get('query', ''))
          else:
              meta['note_user'] = str(req.get('note_user', ''))
          with open('data/fetch_meta.json', 'w', encoding='utf-8') as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit fetched data
        shell: bash
        run: |
          git config user.name "threads-fetch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Fetch external social data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
