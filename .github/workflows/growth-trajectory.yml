name: Threads Growth Trajectory Analysis

on:
  push:
    branches:
      - automation/threads
    paths:
      - .growth-trajectory-request.json
      - scripts/growth_trajectory.py

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Collect and analyze growth trajectory
        run: python scripts/growth_trajectory.py
      - name: Commit trajectory data
        run: |
          git config user.name threads-growth-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/growth_trajectory/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Analyze sora_shikumi growth trajectory'
          git push origin "HEAD:${GITHUB_REF_NAME}"
